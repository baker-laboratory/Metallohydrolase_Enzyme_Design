# CPU analysis plus a Linux x86_64 CUDA helper environment.
# Model packages/checkpoints are separate; see README.md.
# No pixi.lock is shipped: the first install resolves the declared ranges.
[workspace]
name = "zinc-hydro"
version = "0.2.0"
description = "Manuscript analysis and enzyme-design helper environments"
authors = ["Baker Laboratory"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3"
scipy = ">=1.13"
matplotlib = ">=3.9"
seaborn = ">=0.13"
openpyxl = ">=3.1"
pillow = "*"

[pypi-dependencies]
marimo = "==0.25.0"

[tasks]
lab = "marimo edit ../Manuscript_Data/Metallohydrolase_Nature_2026/wetlab_data_analysis.py"

# The historical name "design" refers to helper tooling, not model installation.
[feature.design]
channels = [
    "pytorch",
    "nvidia",
    "https://conda.rosettacommons.org",
    "conda-forge",
    # Pixi does not expand conda's "defaults" multichannel alias.
    "https://repo.anaconda.com/pkgs/main",
    "https://repo.anaconda.com/pkgs/r",
]
platforms = ["linux-64"]

[feature.design.dependencies]
python = "3.10.*"
pip = "*"
numpy = "1.26.*"
pandas = "2.2.*"
scipy = "1.13.*"
matplotlib = "3.9.*"
seaborn = "0.13.*"
openpyxl = "3.1.*"
scikit-learn = "*"
psutil = "*"
jupyterlab = "4.2.*"
ipykernel = "6.28.*"
nbformat = "5.10.*"
ipywidgets = "*"
pytorch = "2.3.1.*"
torchvision = "0.18.1.*"
torchaudio = "2.3.1.*"
pytorch-cuda = "12.1.*"
pyrosetta = "2024.39.*"
biopython = "1.84.*"
rdkit = "2024.03.*"
openbabel = "3.1.*"
openmm = "8.1.*"
fpocket = "4.2.*"
biotite = "1.0.*"
requests = "2.32.*"
attrs = "23.1.*"
pymol-open-source = "3.1.*"
hydra-core = "1.3.*"
omegaconf = "2.3.*"
ml-collections = "0.1.*"
opt_einsum = "3.3.*"
assertpy = "1.1.*"
deepdiff = "7.0.*"
icecream = "2.1.*"
fire = "0.7.*"
tqdm = "4.66.*"

[feature.design.pypi-dependencies]
cython = ">=3.0,<3.1"
prody = { git = "https://github.com/prody/ProDy" }

[environments]
analysis = { solve-group = "analysis" }
design = { features = ["design"], solve-group = "design" }
