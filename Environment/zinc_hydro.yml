# Linux x86_64 helper environment for repository notebooks, PyRosetta scoring,
# structure/ligand preparation, and PyTorch-based sequence-design helpers.
# This does not install RFdiffusion2, foundry/RFdiffusion3, AlphaFold, PLACER,
# their model-specific dependencies, or checkpoints. See Environment/README.md.
# Existing version pins are retained where possible; this is not a lockfile.
# The historical zinc_hydro.lock.yml export is preserved separately.

name: zinc_hydro

channels:
  - pytorch
  - nvidia
  - https://conda.rosettacommons.org
  - conda-forge
  - defaults

dependencies:
  # --- core runtime -----------------------------------------------------
  - python=3.10
  - pip

  # --- scientific python ------------------------------------------------
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - matplotlib=3.9
  - seaborn=0.13
  - openpyxl=3.1          # REQUIRED to read the .xlsx plate-reader data
  - scikit-learn
  - pillow
  - psutil
  - biotite=1.0           # TM-score / lDDT in advanced_structure_prediction_tools
  - requests=2.32         # ligand-code lookups against the RCSB API
  - attrs=23.1            # SimplePdbLib

  # --- notebooks --------------------------------------------------------
  - jupyterlab=4.2
  - ipykernel=6.28
  - nbformat=5.10
  - ipywidgets

  # --- deep learning (CUDA 12.1) ---------------------------------------
  # Linux/NVIDIA helper runtime; model inference has separate environments.
  - pytorch=2.3.1
  - torchvision=0.18.1
  - torchaudio=2.3.1
  - pytorch-cuda=12.1

  # --- structural biology & cheminformatics ----------------------------
  - pyrosetta=2024.39     # obtain appropriate PyRosetta access before installing
  - biopython=1.84
  - rdkit=2024.03
  - openbabel=3.1         # XYZ -> PDB theozyme conversion
  - openmm=8.1
  - fpocket=4.2           # pocket detection, invoked by Scripts/design_filtering/
  - pymol-open-source=3.1 # optional: for viewing outputs; no code here runs it

  # --- pipeline plumbing ------------------------------------------------
  - hydra-core=1.3
  - omegaconf=2.3
  - ml-collections=0.1
  - opt_einsum=3.3
  - assertpy=1.1
  - deepdiff=7.0
  - icecream=2.1
  - fire=0.7
  - tqdm=4.66

  - pip:
      - marimo==0.25.0
      - cython==3.0.*
      - prody @ git+https://github.com/prody/ProDy
