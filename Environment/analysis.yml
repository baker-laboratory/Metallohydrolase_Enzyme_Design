# CPU environment for the four Manuscript_Data/*/wetlab_data_analysis.py apps.
# Run from the repository root; see Environment/README.md for other installers.
# These are version ranges, not a lockfile. Model inference is installed separately.
name: zinc_hydro_analysis
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.13
  - matplotlib>=3.9
  - seaborn>=0.13
  - openpyxl>=3.1
  - pillow
  - pip
  - pip:
      - marimo==0.25.0
